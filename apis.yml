apis:
- name: AI Autocomplete API
  description: 'Framework-agnostic HTTP API behind the AI Autocomplete SDKs. A single POST
    /api/suggest endpoint drives keystroke-by-keystroke guided autocomplete over a placeholder-based
    query model, with a POST /api/auth/token endpoint that exchanges a secret key for a short-lived
    access token. Bearer auth with public (pk_v1_), secret (sk_v1_) and access-token (at_v1_) keys.'
