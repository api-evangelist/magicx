name: MagicX
description: 'MagicX Inc. builds software that lets people take actions instantly from any text
  box. Its flagship developer product, AI Autocomplete, is a drop-in SDK and HTTP API that turns
  a blank input into instant intent — guiding users on what to type with roughly 200ms suggestions,
  delivered as native SDKs for React, Angular, Vanilla JS and Swift or a framework-agnostic HTTP
  API. Auth uses public, secret, and short-lived access-token keys, and pricing is usage-based per
  prediction with a SOC 2 enterprise tier. MagicX also ships Hero Assistant, a consumer AI assistant.
  The company is backed by Forerunner Ventures.'
